<div class="container-page">
  <!-- Resumen Profesional Card -->
   @if (detail) {
    <summary-card [detail]="detail"/>
   }
  
  <!-- Experiencia Profesional Card -->
  @if (detail.experiences.length > 0) {
    <experience-card [experiences]="detail.experiences"></experience-card>
  }

  <!-- Language Card -->
  @if (detail.languages.length > 0) {
    <language-card [languages]="detail.languages"></language-card>
  }

  <!-- Abilities Card -->   
  @if (detail.abilityGroups.length > 0) {
    <ability-card [abilityGroups]="detail.abilityGroups"></ability-card>
  }

  <!-- Education Card -->
  @if (detail.educations.length > 0) {
    <education-card [educations]="detail.educations"></education-card>
  }

  <!-- Certifications Card -->
  @if (detail.certifications.length > 0) {
    <certification-card [certifications]="detail.certifications"></certification-card>
  }
  
  <!-- Links Card -->
  @if (detail.links.length > 0) {
    <link-card [links]="detail.links"></link-card>
  }
</div>
