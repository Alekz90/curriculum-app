<mat-card class="detail-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>Idiomas</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p class="content-card">
      {{ languageComputed() }}
    </p>
  </mat-card-content>
  @if (showActions()) {
    <mat-card-actions align="end">
      <button matButton><mat-icon>edit</mat-icon></button>
      <button matButton><mat-icon>delete</mat-icon></button>
    </mat-card-actions>
  }
</mat-card>
